<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำหนดการอุปสมบท นายสิษฐ์พล อานุภาพ (มิว)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0e6d2;
        }
        .invitation-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            /* ใช้ภาพการ์ดต้นฉบับที่คุณแนบมาเป็นพื้นหลัง */
            background-image: url('Image.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            aspect-ratio: 1 / 1.414;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .map-btn-container {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .map-btn {
            background-color: #27ae60;
            color: white;
            padding: 10px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.3s, transform 0.2s;
            display: inline-block;
            border: 2px solid #ffffff;
        }
        .map-btn:hover {
            background-color: #219653;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="invitation-container">
    <div class="map-btn-container">
        <!-- ปุ่มแผนที่พร้อมลิงก์ที่คุณกำหนด -->
        <a href="https://maps.app.goo.gl/rZvjEkrQ4z6UoKum9?g_st=ic" target="_blank" class="map-btn">
            📍 แผนที่
        </a>
    </div>
</div>

</body>
</html>
